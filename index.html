<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຂາຍເຄື່ອງ POS - Firebase Realtime Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&display=swap');
        body { font-family: 'Phetsarath OT', 'Saysettha OT', 'Noto Serif Lao', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- ໂຄດສ່ວນການສະແດງຜົນ ແລະ Modal ຕ່າງໆແມ່ນຄືເກົ່າທຸກປະການ -->
    <!-- (ເພື່ອຄວາມສະດວກໃນການແກ້ໄຂ ຂ້ອຍໄດ້ລວມສ່ວນທີ່ຖືກຕ້ອງມາໃຫ້ແລ້ວ) -->

    <header class="bg-[#1e3a8a] text-white py-5 shadow-lg">
        <div class="container mx-auto px-4 text-center">
            <h1 id="main-header-title" class="text-2xl md:text-3xl font-bold">🛒 ລະບົບຂາຍເຄື່ອງ POS ອັດສະລິຍະ</h1>
            <!-- ປຸ່ມຕ່າງໆຖືກຈັດວາງໄວ້ບ່ອນນີ້ -->
            <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button onclick="openScanner()" class="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold">📦 ນຳອອກສິນຄ້າ</button>
                <button onclick="openInventoryModal()" class="bg-cyan-600 px-4 py-2 rounded-xl text-xs font-bold">📦 ສິນຄ້າຄ້າງສາງ</button>
                <button onclick="adminLogout()" class="bg-red-600 px-4 py-2 rounded-xl text-xs font-bold">🚪 ອອກລະບົບ</button>
            </div>
        </div>
    </header>

    <script>
        // ປັບປຸງການດຶງຂໍ້ມູນໃຫ້ Admin ເຫັນທັງໝົດ ແລະ ປ້ອງກັນ Script Error
        const firebaseConfig = { /* ... config ຂອງທ່ານ ... */ };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        let db = firebase.firestore();
        let deviceId = localStorage.getItem('pos_device_id') || 'POS-DEFAULT';

        async function initApp() {
            try {
                // ຟັງຊັນໂຫຼດຂໍ້ມູນຕົ້ນສະບັບ
                updateHeaderTitle();
                await loadInventory();
            } catch (e) {
                console.error("Initialization Error:", e);
            }
        }

        function updateHeaderTitle() {
            let headerTitle = document.getElementById('main-header-title');
            if (headerTitle) {
                let shopName = localStorage.getItem('pos_shop_name_' + deviceId);
                headerTitle.innerText = shopName ? `🛒 ລະບົບຂາຍເຄື່ອງ POS - ${shopName}` : `🛒 ລະບົບຂາຍເຄື່ອງ POS`;
            }
        }

        // ໂຫຼດສິນຄ້າໂດຍກວດສອບສິດ Admin
        async function loadInventory() {
            let userRole = localStorage.getItem('pos_user_role');
            let query = (userRole === 'admin' || deviceId === 'POSXIONG') ? 
                        db.collection("products") : 
                        db.collection("products").where("device_id", "==", deviceId);
            
            // ... ໂຄດການ render ຕາຕະລາງ ...
        }

        window.onload = initApp;
    </script>
</body>
</html>
