<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຂາຍເຄື່ອງ POS - Realtime Sync & License</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&display=swap');
        body { font-family: 'Phetsarath OT', 'Saysettha OT', 'Noto Serif Lao', 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Role Selection Modal -->
    <div id="role-select-modal" class="fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <h3 class="text-xl font-bold text-gray-800">ກະລຸນາເລືອກ ປະເພດການເຂົ້າໃຊ້ງານ</h3>
            <button onclick="selectRole('trial')" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow">⏳ ທົດລອງໃຊ້ 15 ວັນ</button>
            <button onclick="showUnifiedLoginModal()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow">🔑 ລັອກອິນ (Admin/ສະມາຊິກ)</button>
        </div>
    </div>

    <!-- Admin Manager Modal -->
    <div id="admin-manager-modal" class="hidden fixed inset-0 bg-black/60 z-[250] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-6 max-h-[85vh] overflow-y-auto space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800">📋 ຈັດການບັນຊີ (Admin)</h3>
                <button onclick="loadAllDevices()" class="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg cursor-pointer font-bold">🔄 ໂຫຼດໃໝ່</button>
            </div>
            <div id="device-list-container" class="space-y-2 text-sm text-gray-700"></div>
            <button onclick="closeAdminManager()" class="w-full bg-gray-500 text-white font-bold py-2.5 rounded-xl">ປິດ</button>
        </div>
    </div>

    <!-- ໃສ່ໂຄດສ່ວນທີ່ເຫຼືອ (Header, Main, Modals ອື່ນໆ) ຕາມໂຄດຫຼັກເດີມທີ່ອາຈານມີໄດ້ເລີຍ -->
    <!-- ຢ່າລືມອັບເດດຟັງຊັນ adminDeleteAccount ແລະ loadAllDevices ຕາມໂຄດເບື້ອງລຸ່ມນີ້ -->

    <script>
        const SUPABASE_URL = "https://omvrghcnswikqxixgcza.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tdnJnaGNuc3dpa3F4aXhnY3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODgyNDEsImV4cCI6MjEwMTM2NDI0MX0.JpYhfe_c_AWPAcuMjQ2rXIZTc1KKbimPyupzV0fYelE";
        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let deviceId = localStorage.getItem('pos_device_id') || 'POS-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('pos_device_id', deviceId);

        // 🌟 Auto-Register
        async function selectRole(role) {
            try {
                await supabaseClient.from('licenses').upsert({
                    device_id: deviceId,
                    status: 'trial',
                    created_at: new Date().toISOString()
                }, { onConflict: 'device_id' });
            } catch(e) {}
            document.getElementById('role-select-modal').classList.add('hidden');
        }

        // 🌟 ໂຫຼດລາຍຊື່ບັນຊີທັງໝົດ
        async function loadAllDevices() {
            let container = document.getElementById('device-list-container');
            let { data } = await supabaseClient.from('licenses').select('*').order('created_at', { ascending: false });
            if (!data) return;
            
            let html = data.map((item, idx) => `
                <div class="bg-gray-50 p-3 rounded-xl border flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-blue-600">${item.device_id}</span>
                        <span class="ml-2 font-bold ${item.status === 'permanent' ? 'text-green-600' : (item.status === 'deleted' ? 'text-red-600' : 'text-amber-600')}">
                            ${item.status === 'permanent' ? '⭐ ຖາວອນ' : (item.status === 'deleted' ? '❌ ລະງັບ' : '⏳ ທົດລອງ')}
                        </span>
                    </div>
                    <div class="flex gap-1">
                        ${item.status !== 'permanent' ? `<button onclick="updateDeviceStatusDirect('${item.device_id}', 'permanent')" class="bg-green-600 text-white px-2 py-1 rounded">ຖາວອນ</button>` : `<button onclick="updateDeviceStatusDirect('${item.device_id}', 'trial')" class="bg-amber-500 text-white px-2 py-1 rounded">ທົດລອງ</button>`}
                        ${item.status !== 'deleted' ? `<button onclick="adminDeleteAccount('${item.device_id}')" class="bg-red-600 text-white px-2 py-1 rounded">ລຶບ</button>` : `<button onclick="updateDeviceStatusDirect('${item.device_id}', 'permanent')" class="bg-blue-600 text-white px-2 py-1 rounded">ກູ້ຄືນ</button>`}
                    </div>
                </div>
            `).join('');
            container.innerHTML = html;
        }

        async function updateDeviceStatusDirect(id, status) {
            await supabaseClient.from('licenses').update({ status }).eq('device_id', id);
            loadAllDevices();
        }

        async function adminDeleteAccount(id) {
            await supabaseClient.from('licenses').update({ status: 'deleted' }).eq('device_id', id);
            loadAllDevices();
        }
        // ... (ຟັງຊັນອື່ນໆຄືເກົ່າ)
    </script>
</body>
</html>
