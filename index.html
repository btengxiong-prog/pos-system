<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຂາຍເຄື່ອງ POS - Realtime Sync & License</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&display=swap');
        body { font-family: 'Phetsarath OT', 'Saysettha OT', 'Noto Serif Lao', 'Times New Roman', Times, serif; }
        @media print {
            body * { visibility: hidden !important; }
            #barcode-generator-modal, #barcode-generator-modal * { visibility: visible !important; }
            #barcode-generator-modal { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; }
            @page { size: auto; margin: 5mm; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">
    <!-- Modal: Role Selection & Login, Admin, Manual, Payment omitted for brevity (Code structure maintained) -->
    <!-- (ທຸກ Modal ຍັງຄົງເດີມຕາມໂຄດຫຼັກທີ່ຜ່ານມາ) -->

    <header class="bg-[#1e3a8a] text-white py-5 shadow-lg">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl font-bold">🛒 ລະບົບຂາຍເຄື່ອງ POS (Barcode 13 ຫຼັກ ສະແກນງ່າຍ)</h1>
            <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button onclick="openScanner()" class="bg-blue-600 px-4 py-2 rounded-xl text-xs sm:text-sm">📷 ສະແກນ</button>
                <button onclick="openBarcodeGenerator()" class="bg-pink-600 px-4 py-2 rounded-xl text-xs sm:text-sm">📉 ສ້າງ Barcode</button>
                <button onclick="openExcelGenerator()" class="bg-purple-600 px-4 py-2 rounded-xl text-xs sm:text-sm">📱 ສ້າງ QR</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-6 max-w-4xl">
        <div id="scanner-container" class="hidden mb-6 bg-white p-4 rounded-xl shadow border">
            <div id="reader" class="w-full max-w-md mx-auto"></div>
        </div>
        <!-- (ຕາຕະລາງ ແລະ ສ່ວນອື່ນໆ ຍັງຄົງເດີມ) -->
        <div id="cart-items" class="bg-white rounded-xl shadow p-4"></div>
    </main>

    <script>
        // 🌟 ຟັງຊັນສະແກນ Barcode: ດຶງລາຄາຈາກ Database ສູນກາງທັນທີ 100%
        async function openScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            await fetchProductsForGenerator(); // ໂຫຼດຂໍ້ມູນສູນກາງມາທຸກຄັ້ງກ່ອນສະແກນ

            if (!html5QrCode) {
                try { html5QrCode = new Html5Qrcode("reader"); } catch(err) { return; }
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    let cleanDecoded = decodedText.trim();
                    // 🔍 ຊອກຫາສິນຄ້າຈາກຖານຂໍ້ມູນສູນກາງ (excelRows)
                    let foundItem = excelRows.find(r => {
                        let codeStr = String(r.code).trim();
                        // ສ້າງເລກ Barcode 13 ຫຼັກຕາມຮູບແບບທີ່ເຮົາພິມອອກມາ
                        let barcode13 = "888" + codeStr.replace(/\D/g, '').padStart(9, '0').slice(-9);
                        return codeStr.toLowerCase() === cleanDecoded.toLowerCase() || barcode13 === cleanDecoded;
                    });

                    let scannedCost = foundItem ? parseFloat(String(foundItem.cost).replace(/,/g, '')) || 0 : 0;
                    let pct = foundItem ? parseFloat(String(foundItem.profitPct).replace(/,/g, '')) || 20 : 20;
                    let scannedPrice = foundItem ? (scannedCost + (scannedCost * pct / 100)) : 0;
                    
                    showConfirmModalParsed(cleanDecoded, foundItem ? foundItem.code : cleanDecoded, scannedCost, scannedPrice);
                },
                (errorMessage) => {}
            ).catch(err => {});
        }

        // 🌟 ຟັງຊັນສ້າງ Barcode: ໃຊ້ຕົວເລກ 13 ຫຼັກ ທີ່ສະແກນງ່າຍ 100%
        async function openBarcodeGenerator() {
            let modal = document.getElementById('barcode-generator-modal');
            let container = document.getElementById('barcode-preview-cards');
            modal.classList.remove('hidden');
            await fetchProductsForGenerator();
            
            let html = '';
            excelRows.forEach((row, idx) => {
                let cost = parseFloat(String(row.cost).replace(/,/g, '')) || 0;
                let pct = parseFloat(String(row.profitPct).replace(/,/g, '')) || 20;
                let price = cost + (cost * pct / 100);
                let cleanCodeNum = String(row.code).replace(/\D/g, '').padStart(9, '0').slice(-9);
                let barcode13 = "888" + cleanCodeNum;

                html += `
                    <div class="bg-white border-2 border-gray-400 p-4 rounded-xl text-center shadow-md">
                        <div class="font-bold text-lg">${row.code}</div>
                        <div class="text-sm">ລາຄາຂາຍ: ${formatNumberWithCommas(price)} ກີບ</div>
                        <div class="flex justify-center my-2"><svg id="barcode-svg-${idx}"></svg></div>
                    </div>
                `;
            });
            container.innerHTML = html;

            excelRows.forEach((row, idx) => {
                let cleanCodeNum = String(row.code).replace(/\D/g, '').padStart(9, '0').slice(-9);
                JsBarcode(`#barcode-svg-${idx}`, "888" + cleanCodeNum, {
                    format: "EAN13", // ໃຊ້ EAN13 ທີ່ສະແກນງ່າຍທີ່ສຸດ
                    width: 2.2, height: 60, displayValue: true, fontSize: 16
                });
            });
        }
        
        // (ຟັງຊັນອື່ນໆ ຍັງຄົງເດີມຕາມໂຄດຫຼັກ)
        async function fetchProductsForGenerator() { /* ດຶງຂໍ້ມູນ... */ }
    </script>
</body>
</html>
