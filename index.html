<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຂາຍເຄື່ອງ POS - Realtime Sync & License</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&display=swap');
        body { font-family: 'Phetsarath OT', 'Saysettha OT', 'Noto Serif Lao', 'Times New Roman', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-[#1e3a8a] text-white py-5 shadow-lg">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl font-bold">🛒 ລະບົບຂາຍເຄື່ອງ POS (Global Realtime Sync)</h1>
            <div id="license-status-badge" class="mt-1 text-xs text-cyan-200">ກຳລັງເຊື່ອມຕໍ່ລະບົບ...</div>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-6 max-w-4xl">
        <div class="grid grid-cols-2 gap-2 mb-6">
            <button onclick="openScanner()" class="bg-blue-600 text-white py-3 rounded-xl font-bold">📷 ສະແກນ</button>
            <button onclick="openHistory()" class="bg-gray-600 text-white py-3 rounded-xl font-bold">📊 ປະຫວັດການຂາຍ</button>
        </div>
        <div id="cart-items" class="bg-white p-4 rounded-xl shadow">ຍັງບໍ່ມີສິນຄ້າ...</div>
    </main>

    <!-- History Modal -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-xl w-full p-5 max-h-[80vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-3">📊 ປະຫວັດການຂາຍທັງໝົດ</h3>
            <div id="history-list" class="space-y-2 text-sm"></div>
            <button onclick="document.getElementById('history-modal').classList.add('hidden')" class="mt-4 bg-gray-500 text-white px-4 py-2 rounded w-full">ປິດ</button>
        </div>
    </div>

    <!-- Script ສ່ວນ Realtime ທີ່ຖືກປັບປຸງ -->
    <script>
        const SUPABASE_URL = "https://omvrghcnswikqxixgcza.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_3E0MYF88KNsZ1PaQED-Ihg_Y11UQ4RD";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ຟັງຊັນ Realtime ແບບເຫັນກັນໝົດທຸກເຄື່ອງ
        function setupRealtimeSync() {
            // 1. ຟັງການຂາຍໃໝ່
            supabase
                .channel('pos_history_channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sales_history' }, () => {
                    if (!document.getElementById('history-modal').classList.contains('hidden')) {
                        loadCloudHistory();
                    }
                })
                .subscribe();
        }

        // ຟັງຊັນດຶງປະຫວັດການຂາຍທັງໝົດ
        async function loadCloudHistory() {
            let listDiv = document.getElementById('history-list');
            listDiv.innerHTML = "ກຳລັງໂຫຼດປະຫວັດ...";
            
            // ດຶງຂໍ້ມູນທັງໝົດໂດຍບໍ່ຕ້ອງກັ່ນຕອງ device_id
            let { data, error } = await supabase
                .from('sales_history')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { listDiv.innerHTML = "ເກີດຂໍ້ຜິດພາດ: " + error.message; return; }
            
            if (!data || data.length === 0) {
                listDiv.innerHTML = "ຍັງບໍ່ມີປະຫວັດການຂາຍ.";
            } else {
                listDiv.innerHTML = data.map(tx => `
                    <div class="p-3 border-b border-gray-100 bg-white rounded shadow-sm">
                        <p class="font-bold text-blue-700">ຍອດ: ${Number(tx.total).toLocaleString()} ກີບ</p>
                        <p class="text-xs text-gray-500">ວັນທີ: ${new Date(tx.created_at).toLocaleString()}</p>
                    </div>
                `).join('');
            }
        }

        function openHistory() {
            document.getElementById('history-modal').classList.remove('hidden');
            loadCloudHistory();
        }

        // ເລີ່ມຕົ້ນລະບົບ
        setupRealtimeSync();
    </script>
</body>
</html>
