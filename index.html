        function autoSlashDateInput(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 8) v = v.substring(0, 8);
            let day = '', month = '', year = '';

            if (v.length >= 5) {
                day = v.substring(0, 2);
                month = v.substring(2, 4);
                year = v.substring(4);
            } else if (v.length >= 3) {
                day = v.substring(0, 2);
                month = v.substring(2, 4);
            } else {
                day = v;
            }

            let formatted = day;
            if (month) formatted += '/' + month;
            if (year) formatted += '/' + year;

            input.value = formatted;
        }

        function formatDateToDDMMYYYY(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            let clean = dateStr.trim().replace(/[\\/\.]/g, '-');
            let parts = clean.split('-');
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                } else if (parts[2].length === 4) {
                    return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
                }
            }
            return dateStr;
        }

        function parseDDMMYYYYToISO(inputStr) {
            if (!inputStr || inputStr.trim() === "") return new Date().toISOString().split('T')[0];
            let clean = inputStr.trim().replace(/[\\/\.]/g, '-');
            let parts = clean.split('-');
            if (parts.length === 3) {
                let d = parts[0].padStart(2, '0');
                let m = parts[1].padStart(2, '0');
                let y = parts[2];
                if (y.length === 2) y = '20' + y;
                if (parts[0].length === 4) {
                    y = parts[0];
                    m = parts[1].padStart(2, '0');
                    d = parts[2].padStart(2, '0');
                }
                let parsed = `${y}-${m}-${d}`;
                let testDate = new Date(parsed);
                if (!isNaN(testDate.getTime())) return parsed;
            }
            return new Date().toISOString().split('T')[0];
        }

        function handleExcelUploadFromModal(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    let jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    let dateVal = document.getElementById('input-custom-rate-date').value.trim();
                    let today = new Date().toISOString().split('T')[0];
                    let parsedDate = dateVal ? parseDDMMYYYYToISO(dateVal) : today;

                    let newRows = [];
                    for (let i = 1; i < jsonData.length; i++) {
                        let r = jsonData[i];
                        if (r && r.length > 0 && r[0]) {
                            let code = String(r[0]).trim();
                            let costInput = parseFloat(String(r[1] || 0).replace(/,/g, '')) || 0;
                            let pctInput = parseFloat(String(r[2] || 20).replace(/,/g, '')) || 20;
                            let priceInput = parseFloat(String(r[3] || 0).replace(/,/g, '')) || 0;
                            let qty = parseInt(String(r[4] || 1).replace(/,/g, '')) || 1;

                            let costLAK = costInput;
                            let priceLAK = priceInput > 0 ? priceInput : Math.ceil((costLAK * (1 + pctInput / 100)) / 1000) * 1000;

                            newRows.push({
                                id: 'ROW-' + Date.now() + '-' + i + '-' + Math.random().toString(36).substring(2, 4),
                                device_id: 'SHARED',
                                code: code,
                                cost: costLAK,
                                originalCost: costLAK,
                                profitPct: pctInput,
                                price: priceLAK,
                                qty: qty,
                                dateAdded: parsedDate,
                                mfgDate: parsedDate,
                                expiryDate: ''
                            });
                        }
                    }

                    excelRows = [...excelRows, ...newRows];
                    showAlert("ສຳເລັດ", `ນຳເຂົ້າຂໍ້ມູນ Excel ສຳເລັດ ${newRows.length} ລາຍການ!`, "📁");
                    openExcelGenerator();
                } catch (err) {
                    showAlert("ຜິດພາດ", "ບໍ່ສາມາດອ່ານໄຟລ໌ Excel ນี้ໄດ້!", "❌");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 🌟 Safe Hybrid Fallback: ດຶງ Cloud ກ່ອນ ຖ້າ Cloud ຫວ່າງເປົ່າ ໃຫ້ດຶງ localStorage ມາສະແດງທັນທີ (ບໍ່ໃຫ້ໜ້າຕາຕະລາງຫວ່າງເປົ່າ)
        async function fetchProductsForGenerator() {
            let cloudRows = [];
            if (supabaseClient) {
                try {
                    let { data, error } = await supabaseClient.from('products').select('*').order('updated_at', { ascending: false });
                    if (!error && data && data.length > 0) {
                        cloudRows = data.map(item => ({
                            id: item.id || ('ROW-' + Math.random().toString(36).substring(2, 6)),
                            device_id: 'SHARED',
                            code: item.code,
                            cost: item.cost,
                            originalCost: item.original_cost || item.cost,
                            profitPct: item.profit_pct,
                            price: item.price,
                            qty: item.qty || 1,
                            dateAdded: item.date_added || item.updated_at ? new Date(item.date_added || item.updated_at).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
                            mfgDate: item.mfg_date || '',
                            expiryDate: item.expiry_date || ''
                        }));
                    }
                } catch (e) {}
            }

            if (cloudRows.length > 0) {
                excelRows = cloudRows;
                localStorage.setItem('pos_saved_excel_rows', JSON.stringify(excelRows));
            } else {
                let savedRows = localStorage.getItem('pos_saved_excel_rows');
                excelRows = savedRows ? JSON.parse(savedRows) : [];
            }
        }

        async function loadInventory() {
            let tbody = document.getElementById('inventory-tbody');
            tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-gray-400">ກຳລັງໂຫຼດຂໍ້ມູນສິນຄ້າຄ້າງສາງ...</td></tr>`;

            await fetchProductsForGenerator();

            let combinedSalesMap = new Map();
            let localHistory = JSON.parse(localStorage.getItem('pos_local_history') || '[]');
            localHistory.forEach(tx => combinedSalesMap.set(tx.id || tx.created_at, tx));

            if (supabaseClient) {
                try {
                    let { data: cloudSales } = await supabaseClient.from('sales_history').select('*');
                    if (cloudSales) {
                        cloudSales.forEach(tx => {
                            let key = tx.id || tx.created_at;
                            combinedSalesMap.set(key, {
                                id: tx.id, device_id: tx.device_id, created_at: tx.created_at, items: tx.items || []
                            });
                        });
                    }
                } catch (e) {}
            }

            let allSalesHistory = Array.from(combinedSalesMap.values());

            let soldQtyMap = {};
            allSalesHistory.forEach(tx => {
                if (tx.items) {
                    tx.items.forEach(it => {
                        let cKey = String(it.code || '').trim().toLowerCase();
                        soldQtyMap[cKey] = (soldQtyMap[cKey] || 0) + (parseInt(it.qty) || 1);
                    });
                }
            });

            if (excelRows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-gray-400">ຍັງບໍ່ມີຂໍ້ມູນສິນຄ້າໃນລະບົບ</td></tr>`;
                return;
            }

            let html = '';
            let countIndex = 1;
            let canDelete = true;

            excelRows.forEach((row) => {
                let codeKey = String(row.code || '').trim().toLowerCase();
                let initialQty = parseInt(String(row.qty || 1).replace(/,/g, '')) || 1;
                let soldQty = soldQtyMap[codeKey] || 0;
                let remainingQty = initialQty - soldQty;
                if (remainingQty < 0) remainingQty = 0;

                let cost = parseFloat(String(row.cost || 0).replace(/,/g, '')) || 0;
                let price = parseFloat(String(row.price || 0).replace(/,/g, '')) || 0;
                let formattedDate = formatDateToDDMMYYYY(row.dateAdded || new Date().toISOString().split('T')[0]);
                let formattedMfg = formatDateToDDMMYYYY(row.mfgDate || row.dateAdded);
                let expDateStr = row.expiryDate ? formatDateToDDMMYYYY(row.expiryDate) : '-';

                let deleteBtnHtml = canDelete ? 
                    `<button onclick="promptDeleteInventoryRow('${row.id}')" class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded font-bold cursor-pointer hover:bg-red-200 transition">🗑️ ລຶບ</button>` : 
                    `<span class="text-gray-400 text-xs">-</span>`;

                html += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="p-3 border-r text-center font-bold text-gray-500 text-xs">${countIndex++}</td>
                        <td class="p-3 border-r font-bold text-gray-900">${row.code || '-'}</td>
                        <td class="p-3 border-r text-center font-semibold text-purple-700">${formattedDate}</td>
                        <td class="p-3 border-r text-center font-semibold text-gray-700">${formattedMfg}</td>
                        <td class="p-3 border-r text-center font-bold text-red-600">${expDateStr}</td>
                        <td class="p-3 border-r text-right text-blue-600 font-semibold">${formatNumberWithCommas(cost)}</td>
                        <td class="p-3 border-r text-right text-green-600 font-semibold">${formatNumberWithCommas(price)}</td>
                        <td class="p-3 border-r text-center text-xs font-bold text-indigo-700">ຍັງເຫຼືອ: ${remainingQty} ອັນ</td>
                        <td class="p-3 text-center">${deleteBtnHtml}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function promptDeleteInventoryRow(rowId) {
            let targetRow = excelRows.find(r => r.id === rowId);
            if (!targetRow) return;

            showCustomConfirm("ຢືນຢັນການລຶບສິນຄ້າ", `ທ່ານຕ້ອງການລຶບສິນຄ້າ [${targetRow.code}] ນີ້ອອກຈາກສາງແທ້ບໍ?`, async (confirmed) => {
                if (!confirmed) return;

                excelRows = excelRows.filter(r => r.id !== rowId);
                localStorage.setItem('pos_saved_excel_rows', JSON.stringify(excelRows));

                if (supabaseClient && rowId) {
                    try {
                        await supabaseClient.from('products').delete().eq('id', rowId);
                    } catch (e) {}
                }

        async function loadExpiryCheck() {
            let tbody = document.getElementById('expiry-tbody');
            tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-400">ກຳລັງກວດສອບວັນໝົດອາຍຸ...</td></tr>`;

                return;
            }

            let html = '';
            let today = new Date();
            let countIndex = 1;
            let hasFiltered = false;

            excelRows.forEach((row) => {
                let dateAddedStr = row.dateAdded || new Date().toISOString().split('T')[0];
                let addedDate = new Date(dateAddedStr);
                let expiryDate = new Date(addedDate);
                let expiryStr = row.expiryDate || '';

                if (expiryStr) {
                    expiryDate = new Date(expiryStr);
                } else {
                    expiryDate.setDate(expiryDate.getDate() + 365);
                    expiryStr = expiryDate.toISOString().split('T')[0];
                }

                let diffTime = expiryDate - today;
                let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays <= 60) {
                    hasFiltered = true;
                    let formattedExpiry = formatDateToDDMMYYYY(expiryStr);

                    let noteBadge = diffDays < 0 ? 
                        `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700">❌ ໝົດອາຍຸແລ້ວ</span>` :

                    let formattedDate = formatDateToDDMMYYYY(dateAddedStr);
                    let formattedMfg = formatDateToDDMMYYYY(row.mfgDate || dateAddedStr);

                    let cost = parseFloat(String(row.cost || 0).replace(/,/g, '')) || 0;
                    let price = parseFloat(String(row.price || 0).replace(/,/g, '')) || 0;

                    html += `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="p-3 border-r text-center font-bold text-gray-500 text-xs">${countIndex++}</td>
                            <td class="p-3 border-r font-bold text-gray-900">${row.code || '-'}</td>

                            <td class="p-3 border-r text-center font-semibold text-gray-700">${formattedMfg}</td>
                            <td class="p-3 border-r text-center font-bold text-red-600">${formattedExpiry}</td>
                            <td class="p-3 border-r text-right text-blue-600 font-semibold">${formatNumberWithCommas(cost)}</td>
                            <td class="p-3 border-r text-right text-green-600 font-semibold">${formatNumberWithCommas(price)}</td>
                            <td class="p-3 text-center">${noteBadge}</td>
                        </tr>
                    `;
                }
            });

            if (!hasFiltered) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-green-600 font-bold">🎉 ບໍ່ມີສິນຄ້າໃກ້ໝົດອາຍຸໃນຊ່ວງ 60 ວັນນີ້!</td></tr>`;

        async function openStockInScanner() {
            document.getElementById('stock-in-scanner-container').classList.remove('hidden');
            await fetchProductsForGenerator();

            if (!stockInQrCode) {
                try { stockInQrCode = new Html5Qrcode("stock-in-reader"); } catch(err) { return; }
            }
            stockInQrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    let currentTime = new Date().getTime();
                    if (decodedText === lastScannedCode && (currentTime - lastScanTime < 2000)) return;
                    lastScannedCode = decodedText;
                    lastScanTime = currentTime;

                    let cleanDecoded = decodedText.trim();
                    let parsedCost = 0;
                    let targetCode = cleanDecoded;

                    try {
                        let parsedJson = JSON.parse(cleanDecoded);
                        if (parsedJson && parsedJson.code) {
                            targetCode = parsedJson.code;
                            parsedCost = parseFloat(parsedJson.cost) || 0;
                        }
                    } catch (e) {}

                    openStockInModal(targetCode, parsedCost);
                },
                (errorMessage) => {}
            ).catch(err => {});
        }

        function closeStockInScanner() {
            if (stockInQrCode) {
                stockInQrCode.stop().then(() => { 
                    document.getElementById('stock-in-scanner-container').classList.add('hidden'); 
                }).catch(() => {});
            } else { 
                document.getElementById('stock-in-scanner-container').classList.add('hidden'); 
            }
        }

        async function confirmStockIn() {
            let costVal = parseFloat(String(document.getElementById('stock-in-cost').value).replace(/,/g, '')) || 0;
            let qtyVal = parseInt(document.getElementById('stock-in-qty').value) || 1;
            let mfgDateInput = document.getElementById('stock-in-mfg-date') ? document.getElementById('stock-in-mfg-date').value.trim() : "";

                return;
            }

            let isoMfgDate = new Date().toISOString().split('T')[0];
            let calculatedExpiryDate = "";

            if (isExpiryMode) {
                if (!mfgDateInput || !expDateInput) {
                    showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາປ້ອນທັງວັນຜະລິດ ແລະ ວັນໝົດອາຍຸໃຫ້ຄົບຖ້ວນ!", "⚠️");
                    return;
                }
                isoMfgDate = parseDDMMYYYYToISO(mfgDateInput);
                let mfgDateObj = new Date(isoMfgDate);
                if (isNaN(mfgDateObj.getTime())) {
                    showAlert("ແຈ້ງເຕືອນ", "ຮູບແບບວັນຜະລິດບໍ່ຖືກຕ້ອງ! ກະລຸນາປ້ອນເປັນ dd/mm/yyyy", "⚠️");
                    return;
                }

                calculatedExpiryDate = parseDDMMYYYYToISO(expDateInput);

                if (isNaN(expDateObj.getTime())) {
                    showAlert("ແຈ້ງເຕືອນ", "ຮູບແບບວັນໝົດອາຍຸບໍ່ຖືກຕ້ອງ! ກະລຸນາປ້ອນເປັນ dd/mm/yyyy", "⚠️");

            let today = new Date().toISOString().split('T')[0];
            let rawPrice = costVal + (costVal * 20 / 100);
            let priceVal = Math.ceil(rawPrice / 1000) * 1000;
            let newRowId = 'ROW-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);

        async function showConfirmModalParsed(code, name, cost, price) {
            tempScannedCode = code;
            document.getElementById('modal-code').innerText = code;
            document.getElementById('modal-name').value = name;
            document.getElementById('modal-cost').value = (cost !== "" && cost > 0) ? formatNumberWithCommas(cost) : "";
            document.getElementById('modal-price').value = (price !== "" && price > 0) ? formatNumberWithCommas(price) : "";
            
            await fetchProductsForGenerator();
            
            let combinedSalesMap = new Map();
            let localHistory = JSON.parse(localStorage.getItem('pos_local_history') || '[]');
            localHistory.forEach(tx => combinedSalesMap.set(tx.id || tx.created_at, tx));

            if (supabaseClient) {
                try {
                    let { data: cloudSales } = await supabaseClient.from('sales_history').select('*');
                    if (cloudSales) {
                        cloudSales.forEach(tx => {
                            let key = tx.id || tx.created_at;
                            combinedSalesMap.set(key, { id: tx.id, device_id: tx.device_id, created_at: tx.created_at, items: tx.items || [] });
                        });
                    }
                } catch (e) {}
            }
            let allSalesHistory = Array.from(combinedSalesMap.values());

            let soldQtyMap = {};
            allSalesHistory.forEach(tx => {
                if (tx.items) {
                    tx.items.forEach(it => {
                        let cKey = String(it.code || '').trim().toLowerCase();
                        soldQtyMap[cKey] = (soldQtyMap[cKey] || 0) + (parseInt(it.qty) || 1);
                    });
                }
            });

            let cKey = String(code || '').trim().toLowerCase();
            let totalStock = 0;
            excelRows.forEach(row => {
                if (String(row.code || '').trim().toLowerCase() === cKey) {
                    totalStock += parseInt(String(row.qty || 1).replace(/,/g, '')) || 1;
                }
            });

            let totalSold = soldQtyMap[cKey] || 0;
            let remainingStock = totalStock - totalSold;
            if (remainingStock < 0) remainingStock = 0;

            let inCart = cart.find(it => String(it.code || '').trim().toLowerCase() === cKey && it.cost === cost && it.price === price);
            let inCartQty = inCart ? inCart.qty : 0;
            let finalAvailable = remainingStock - inCartQty;
            if (finalAvailable < 0) finalAvailable = 0;

            document.getElementById('modal-stock-remaining').value = finalAvailable;

            let qtyElem = document.getElementById('modal-qty');
            if (qtyElem) {
                qtyElem.value = "1";
                qtyElem.max = finalAvailable;
            }

            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        async function confirmScannedItem() {
            let nameInput = document.getElementById('modal-name').value.trim();
            let costInput = parseFloat(String(document.getElementById('modal-cost').value).replace(/,/g, '')) || 0;
            let priceInput = parseFloat(String(document.getElementById('modal-price').value).replace(/,/g, '')) || 0;
            let qtyInput = parseInt(document.getElementById('modal-qty').value) || 1;
            let stockRemaining = parseInt(document.getElementById('modal-stock-remaining').value) || 0;

            if (!nameInput) { showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາປ້ອນຊື່ສິນຄ້າ!", "⚠️"); return; }

            if (qtyInput <= 0) {
                showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາປ້ອນຈຳນວນໃຫ້ຖືກຕ້ອງ!", "⚠️");
                return;
            }

            if (qtyInput > stockRemaining) {
                showAlert("ສິນຄ້າໃນສາງບໍ່ພໍ", `ສິນຄ້າ [${nameInput}] ໃນສາງເຫຼືອພຽງ ${stockRemaining} ອັນເທົ່ານັ້ນ! ບໍ່ສາມາດຂາຍເກີນຈຳນວນສາງໄດ້.`, "❌");
                return;
            }

            let existingInCart = cart.find(item => item.code === tempScannedCode && item.cost === costInput && item.price === priceInput);
            if (existingInCart) {
                let totalNewQty = existingInCart.qty + qtyInput;
                if (totalNewQty > (stockRemaining + existingInCart.qty)) {
                    showAlert("ສິນຄ້າໃນສາງບໍ່ພໍ", `ສິນຄ້າໃນສາງເຫຼືອພຽງ ${stockRemaining} ອັນເທົ່ານັ້ນ!`, "❌");
                    return;
                }
                existingInCart.qty = totalNewQty;
            } else {
                cart.push({ code: tempScannedCode, name: nameInput, cost: costInput, price: priceInput, qty: qtyInput });
            }

            renderCart();

        async function openScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            await fetchProductsForGenerator();

            if (!html5QrCode) {
                try { html5QrCode = new Html5Qrcode("reader"); } catch(err) { return; }
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 300, height: 150 } },
                (decodedText) => {
                    let currentTime = new Date().getTime();
                    if (decodedText === lastScannedCode && (currentTime - lastScanTime < 3000)) return;
                    lastScannedCode = decodedText;
                    lastScanTime = currentTime;
                    
                    let cleanDecoded = String(decodedText).trim();
                    let scannedCode = cleanDecoded;
                    let scannedCost = 0;
                    let scannedPrice = 0;
                    let scannedName = cleanDecoded;

                    try {
                        let parsedJson = JSON.parse(cleanDecoded);
                        if (parsedJson && parsedJson.code) {
                            scannedCode = parsedJson.code;
                            scannedCost = parseFloat(parsedJson.cost) || 0;
                            scannedPrice = parseFloat(parsedJson.price) || 0;
                            scannedName = parsedJson.code;
                            showConfirmModalParsed(scannedCode, scannedName, scannedCost, scannedPrice);
                            return;
                        }
                    } catch (e) {}

                    let matches = excelRows.filter(r => {
                        let itemCode = String(r.code || '').trim();
                        return itemCode.toLowerCase() === cleanDecoded.toLowerCase();
                    });

                    if (matches.length === 0) {
                        let cleanDecodedDigits = cleanDecoded.replace(/\D/g, '');
                        matches = excelRows.filter(r => {
                            let itemCodeDigits = String(r.code || '').replace(/\D/g, '');
                            return itemCodeDigits !== '' && cleanDecodedDigits !== '' && itemCodeDigits === cleanDecodedDigits;
                        });
                    }

                    if (matches.length > 1) {
                        let firstPrice = parseFloat(String(matches[0].price).replace(/,/g, '')) || 0;
                        let firstCost = parseFloat(String(matches[0].cost).replace(/,/g, '')) || 0;
                        let allSame = matches.every(m => {
                            let p = parseFloat(String(m.price).replace(/,/g, '')) || 0;
                            let c = parseFloat(String(m.cost).replace(/,/g, '')) || 0;
                            return p === firstPrice && c === firstCost;
                        });

                        if (allSame) {
                            showConfirmModalParsed(matches[0].code, matches[0].code, firstCost, firstPrice);
                        } else {
                            openSelectPriceModal(cleanDecoded, matches);
                        }
                    } else if (matches.length === 1) {
                        let foundItem = matches[0];
                        scannedCode = foundItem.code;
                        scannedCost = parseFloat(String(foundItem.cost).replace(/,/g, '')) || 0;
                        scannedPrice = parseFloat(String(foundItem.price).replace(/,/g, '')) || 0;
                        scannedName = foundItem.code;
                        showConfirmModalParsed(scannedCode, scannedName, scannedCost, scannedPrice);
                    } else {
                        showConfirmModalParsed(scannedCode, scannedName, 0, 0);
                    }
                },
                (errorMessage) => {}
            ).catch(err => {});
        }

        async function updateCartQtyDirect(index, inputElem) {
            let val = parseInt(inputElem.value);
            if (isNaN(val) || val <= 0) {
                val = 1;
            }

            await fetchProductsForGenerator();
            let combinedSalesMap = new Map();
            if (supabaseClient) {
                try {
                    let { data: cloudSales } = await supabaseClient.from('sales_history').select('*');
                    if (cloudSales) {
                        cloudSales.forEach(tx => {
                            let key = tx.id || tx.created_at;
                            combinedSalesMap.set(key, { id: tx.id, device_id: tx.device_id, created_at: tx.created_at, items: tx.items || [] });
                        });
                    }
                } catch (e) {}
            }
            let allSalesHistory = Array.from(combinedSalesMap.values());

            let soldQtyMap = {};
            allSalesHistory.forEach(tx => {
                if (tx.items) {
                    tx.items.forEach(it => {
                        let cKey = String(it.code || '').trim().toLowerCase();
                        soldQtyMap[cKey] = (soldQtyMap[cKey] || 0) + (parseInt(it.qty) || 1);
                    });
                }
            });

            let targetItem = cart[index];
            let cKey = String(targetItem.code || '').trim().toLowerCase();
            let totalStock = 0;
            excelRows.forEach(row => {
                if (String(row.code || '').trim().toLowerCase() === cKey) {
                    totalStock += parseInt(String(row.qty || 1).replace(/,/g, '')) || 1;
                }
            });

            let totalSold = soldQtyMap[cKey] || 0;
            let otherCartQty = 0;
            cart.forEach((it, idx) => {
                if (idx !== index && String(it.code || '').trim().toLowerCase() === cKey) {
                    otherCartQty += it.qty;
                }
            });

            let remainingStock = totalStock - totalSold - otherCartQty;
            if (remainingStock < 0) remainingStock = 0;

            if (val > remainingStock) {
                showAlert("ສິນຄ້າໃນສາງບໍ່ພໍ", `ສິນຄ້າ [${targetItem.name}] ໃນສາງເຫຼືອພຽງ ${remainingStock} ອັນເທົ່ານັ້ນ!`, "⚠️");
                inputElem.value = remainingStock;
                cart[index].qty = remainingStock;
            } else {
                cart[index].qty = val;
            }
            renderCart();
        }

        function calculateChange() {
            let grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let grandTotalCost = cart.reduce((sum, item) => sum + ((item.cost || 0) * item.qty), 0);
            
            let customPriceVal = document.getElementById('custom-final-price').value.replace(/,/g, '');
            let finalTotal = customPriceVal !== "" ? (parseFloat(customPriceVal) || 0) : grandTotal;
            if (finalTotal < 0) finalTotal = 0;

            let grandTotalProfit = finalTotal - grandTotalCost;

            document.getElementById('final-total').innerText = formatNumberWithCommas(finalTotal) + " ກີບ";
            document.getElementById('grand-total-profit').innerText = formatNumberWithCommas(grandTotalProfit) + " ກີບ";

            let cashInput = document.getElementById('cash-given').value.replace(/,/g, ''), changeElem = document.getElementById('change-amount');
            if (!cashInput) { changeElem.innerText = "0 ກີບ (ຈ່າຍພໍດີ)"; return; }
            let cashGiven = parseFloat(cashInput) || 0, change = cashGiven - finalTotal;
            changeElem.innerText = change >= 0 ? formatNumberWithCommas(change) + " ກີບ" : "ເງິນຍັງບໍ່ພໍ";
        }

        async function checkStockAvailability() {
            await fetchProductsForGenerator();
            
            let combinedSalesMap = new Map();
            if (supabaseClient) {
                try {
                    let { data: cloudSales } = await supabaseClient.from('sales_history').select('*');
                    if (cloudSales) {
                        cloudSales.forEach(tx => {
                            let key = tx.id || tx.created_at;
                            combinedSalesMap.set(key, { id: tx.id, device_id: tx.device_id, created_at: tx.created_at, items: tx.items || [] });
                        });
                    }
                } catch (e) {}
            }
            let allSalesHistory = Array.from(combinedSalesMap.values());

            let soldQtyMap = {};
            allSalesHistory.forEach(tx => {
                if (tx.items) {
                    tx.items.forEach(it => {
                        let cKey = String(it.code || '').trim().toLowerCase();
                        soldQtyMap[cKey] = (soldQtyMap[cKey] || 0) + (parseInt(it.qty) || 1);
                    });
                }
            });

            let stockMap = {};
            excelRows.forEach(row => {
                let cKey = String(row.code || '').trim().toLowerCase();
                let initial = parseInt(String(row.qty || 1).replace(/,/g, '')) || 1;
                stockMap[cKey] = (stockMap[cKey] || 0) + initial;
            });

            for (let item of cart) {
                let cKey = String(item.code || '').trim().toLowerCase();
                let totalStock = stockMap[cKey] || 0;
                let totalSold = soldQtyMap[cKey] || 0;
                let remaining = totalStock - totalSold;
                if (remaining < 0) remaining = 0;

                if (item.qty > remaining) {
                    return { ok: false, name: item.name, requested: item.qty, available: remaining };
                }
            }
            return { ok: true };
        }

            if (supabaseClient) {
                try {
                    let { data: cloudSales, error } = await supabaseClient
                        .from('sales_history')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (!error && cloudSales) {
                        cloudSales.forEach(tx => {
                            let key = tx.id || tx.created_at;
                            combinedMap.set(key, {
                                id: tx.id, source: 'cloud', device_id: tx.device_id, created_at: tx.created_at,
                                total_items: tx.total_items || 0, total_cost: tx.total_cost || 0,
                                discount: tx.discount || 0, total: tx.total, cash: tx.cash, change: tx.change, 
                                payment_method: tx.payment_method || 'cash', items: tx.items || []
                            });
                        });
                    }
                } catch (err) {}
            }

            globalHistoryList = Array.from(combinedMap.values()).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (globalHistoryList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-400">ຍັງບໍ່ມີປະຫວັດການຂາຍ.</td></tr>`;
                return;
            }

            let flatRows = [];
            globalHistoryList.forEach((tx) => {
                let txDateObj = new Date(tx.created_at);
                let dateStr = !isNaN(txDateObj.getTime()) ? formatDateToDDMMYYYY(txDateObj.toISOString().split('T')[0]) : '-';
                let payMethod = tx.payment_method || 'cash';
                let currencyLabel = (payMethod === 'transfer_thb') ? 'ບາດ' : 'ກີບ';

                if (tx.items && Array.isArray(tx.items)) {
                    tx.items.forEach((it, itemIdx) => {
                        let itemName = it.name || it.code || '-';
                        let itemCost = parseFloat(it.cost || 0) || 0;
                        let itemPrice = parseFloat(it.price || 0) || 0;
                        let itemQty = parseInt(it.qty || 1) || 1;
                        let itemTotal = itemPrice * itemQty;
                        let itemTotalCost = itemCost * itemQty;

                        flatRows.push({
                            txId: tx.id || tx.created_at,
                            itemIndex: itemIdx,
                            dateStr: dateStr,
                            itemName: itemName,
                            device_id: tx.device_id,
                            cost: itemCost,
                            price: itemPrice,
                            qty: itemQty,
                            total: itemTotal,
                            totalCost: itemTotalCost,
                            currency: currencyLabel
                        });
                    });
                }
            });

            flatRows.sort((a, b) => b.qty - a.qty);

            let html = '';
            let countIndex = 1;
            let sumCostTotal = 0;
            let sumPriceTotal = 0;

            flatRows.forEach(row => {
                sumCostTotal += row.totalCost;
                sumPriceTotal += row.total;

                html += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="p-3 border-r text-center font-bold text-gray-500 text-xs">${countIndex++}</td>
                        <td class="p-3 border-r text-center font-semibold text-purple-700">${row.dateStr}</td>
                        <td class="p-3 border-r font-bold text-gray-900">${row.itemName}</td>
                        <td class="p-3 border-r text-right text-blue-600 font-semibold">${formatNumberWithCommas(row.cost)} ${row.currency}</td>
                        <td class="p-3 border-r text-right text-green-600 font-semibold">${formatNumberWithCommas(row.price)} ${row.currency}</td>
                        <td class="p-3 border-r text-center font-bold text-gray-800">${row.qty}</td>
                        <td class="p-3 border-r text-right font-bold text-gray-900 bg-gray-50">${formatNumberWithCommas(row.total)} ${row.currency}</td>
                        <td class="p-3 text-center text-xs font-semibold text-gray-600">-</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            let profitTotal = sumPriceTotal - sumCostTotal;

            let defaultCurr = 'ກີບ';
            document.getElementById('sum-total-cost').innerText = formatNumberWithCommas(sumCostTotal) + " " + defaultCurr;
            document.getElementById('sum-total-price').innerText = formatNumberWithCommas(sumPriceTotal) + " " + defaultCurr;
            document.getElementById('sum-total-profit').innerText = formatNumberWithCommas(profitTotal) + " " + defaultCurr;
            document.getElementById('history-summary').classList.remove('hidden');
        }

        async function confirmExecuteDeleteHistory() {
            let checkedBoxes = document.querySelectorAll('input[name="del_hist_checkbox"]:checked');
            if (checkedBoxes.length === 0) {
                showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາຕິກເລືອກລາຍການທີ່ຕ້ອງການລຶບຢ່າງໜ້ອຍ 1 ລາຍການ!", "⚠️");
                return;
            }

            showCustomConfirm("ຢືນຢັນການລຶບປະຫວັດ", `ທ່ານໝັ້ນໃຈບໍທີ່ຈະລຶບ ${checkedBoxes.length} ລາຍການທີ່ເລືອກນີ້ອອກຈາກປະຫວັດ?`, async (confirmed) => {
                if (!confirmed) return;

                let deleteMap = new Map();
                checkedBoxes.forEach(cb => {
                    let parts = cb.value.split('___');
                    let txId = parts[0];
                    let txCreated = parts[1];
                    let itemIdx = parseInt(parts[2]);

                    let mapKey = txId && txId !== 'undefined' ? txId : txCreated;
                    if (!deleteMap.has(mapKey)) deleteMap.set(mapKey, { indices: [], created_at: txCreated, id: txId });
                    deleteMap.get(mapKey).indices.push(itemIdx);
                });

                if (supabaseClient) {
                    try {
                        for (let [mKey, val] of deleteMap.entries()) {
                            let query = supabaseClient.from('sales_history').select('*');
                            if (val.id && val.id !== 'undefined') {
                                query = query.or(`id.eq.${val.id},created_at.eq.${val.created_at}`);
                            } else {
                                query = query.eq('created_at', val.created_at);
                            }

                            let { data: cloudTxList } = await query;
                            if (cloudTxList && cloudTxList.length > 0) {
                                for (let cTx of cloudTxList) {
                                    if (cTx.items) {
                                        let indicesToRemove = val.indices;
                                        indicesToRemove.sort((a, b) => b - a);
                                        indicesToRemove.forEach(idx => {
                                            cTx.items.splice(idx, 1);
                                        });

                                        if (cTx.items.length === 0) {
                                            await supabaseClient.from('sales_history').delete().eq('id', cTx.id);
                                        } else {
                                            await supabaseClient.from('sales_history').update({ items: cTx.items }).eq('id', cTx.id);
                                        }
                                    }
                                }
                            }
                        }
                    } catch (e) {}
                }

                showAlert("ສຳເລັດ", "ລຶບລາຍການປະຫວັດທີ່ເລືອກສຳເລັດຮຽບຮ້ອຍ!", "🗑️");
                closeDeleteHistoryModal();
                loadCloudHistory();
            });
        }

        async function calculateReport() {
            let reportType = document.getElementById('report-type').value;
            let year = parseInt(document.getElementById('report-year').value);
            
            let totalCost = 0;
            let totalPrice = 0;
            let allSales = [];

            if (supabaseClient) {
                try {
                    let { data: cloudSales } = await supabaseClient.from('sales_history').select('*');
                    if (cloudSales) {
                        allSales = cloudSales;
                    }
                } catch (e) {}
            }

            allSales.forEach(tx => {
                let txDate = new Date(tx.created_at);
                if (isNaN(txDate)) return;

                let txYear = txDate.getFullYear();
                let txMonth = txDate.getMonth() + 1;

                if (txYear === year) {
                    let match = false;

                    if (reportType === 'monthly') {
                        let selectedMonth = parseInt(document.getElementById('report-month').value);
                        if (txMonth === selectedMonth) match = true;
                    } 
                    else if (reportType === 'quarterly') {
                        let quarter = parseInt(document.getElementById('report-quarter').value);
                        let qMonths = { 1: [1,2,3], 2: [4,5,6], 3: [7,8,9], 4: [10,11,12] };
                        if (qMonths[quarter].includes(txMonth)) match = true;
                    } 
                    else if (reportType === 'duration') {
                        let durationMonths = parseInt(document.getElementById('report-duration-months').value);
                        if (txMonth <= durationMonths) match = true;
                    }

                    if (match) {
                        totalCost += parseFloat(tx.total_cost || 0);
                        totalPrice += parseFloat(tx.total || 0);
                    }
                }
            });

            let profit = totalPrice - totalCost;

            document.getElementById('rep-total-cost').innerText = formatNumberWithCommas(totalCost) + " ກີບ";
            document.getElementById('rep-total-price').innerText = formatNumberWithCommas(totalPrice) + " ກີບ";
            document.getElementById('rep-total-profit').innerText = formatNumberWithCommas(profit) + " ກີບ";
        }

        function addExcelRow(code = '', cost = '', profitPct = 20, price = '', qty = 1, dateAdded = '') {
            syncTableInputsToData();
            let today = new Date().toISOString().split('T')[0];
            let newId = 'ROW-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
            excelRows.push({ id: newId, device_id: 'SHARED', code: code, cost: cost, originalCost: cost || 0, profitPct: profitPct, price: price, qty: qty, dateAdded: dateAdded || today });
            renderExcelTable();
        }

        function removeExcelRow(index) {
            syncTableInputsToData();
            excelRows.splice(index, 1);
            renderExcelTable();
        }

            excelRows = [];
            if (supabaseClient) {
                try { await supabaseClient.from('products').delete().neq('id', '0'); } catch (e) {}

        function handleInputLive(index, field, value) {
            if (field === 'code') {
                excelRows[index].code = value;
            } else if (field === 'cost') {
                excelRows[index].cost = value;
                excelRows[index].originalCost = value;
            } else if (field === 'profitPct') {
                excelRows[index].profitPct = value;
            } else if (field === 'price') {
                excelRows[index].price = value;
            } else if (field === 'qty') {
                excelRows[index].qty = value;
            } else if (field === 'dateAdded') {
                excelRows[index].dateAdded = value;
            }
        }

        function handleExcelCellKeydown(event, rowIndex, fieldName) {
            if (event.key === 'Enter') {
                event.preventDefault();
                syncTableInputsToData();

                if (rowIndex === excelRows.length - 1) {
                    addExcelRow();
                } else {
                    renderExcelTable();
                }

                setTimeout(() => {
                    let nextRowInputs = document.querySelectorAll(`#excel-tbody tr`);
                    if (nextRowInputs[rowIndex + 1]) {
                        let targetInput = nextRowInputs[rowIndex + 1].querySelector(`[data-field="${fieldName}"]`);
                        if (targetInput) {
                            targetInput.focus();
                        }
                    }
                }, 50);
            }
        }

        function syncTableInputsToData() {
            let rowsInput = document.querySelectorAll('#excel-tbody tr');
            rowsInput.forEach((tr, index) => {
                if (excelRows[index]) {
                    if (!excelRows[index].id) {
                        excelRows[index].id = 'ROW-' + Date.now() + '-' + index;
                    }
                    if (!excelRows[index].device_id) {
                        excelRows[index].device_id = 'SHARED';
                    }
                    let codeInput = tr.querySelector('input[data-field="code"]');
                    let costInput = tr.querySelector('input[data-field="cost"]');
                    let pctInput = tr.querySelector('input[data-field="profitPct"]');
                    let priceInput = tr.querySelector('input[data-field="price"]');
                    let qtyInput = tr.querySelector('input[data-field="qty"]');
                    let dateInput = tr.querySelector('input[data-field="dateAdded"]');

                    if (codeInput) excelRows[index].code = codeInput.value.trim();
                    if (costInput) {
                        let cVal = costInput.value.trim();
                        excelRows[index].cost = cVal;
                        if (!excelRows[index].originalCost) excelRows[index].originalCost = cVal;
                    }
                    if (pctInput) excelRows[index].profitPct = pctInput.value.trim();
                    if (priceInput) excelRows[index].price = priceInput.value.trim();
                    if (qtyInput) excelRows[index].qty = qtyInput.value.trim() === '' ? 1 : qtyInput.value.trim();
                    if (dateInput) excelRows[index].dateAdded = dateInput.value;
                }
            });
        }

            let val = parseFloat(document.getElementById('input-global-pct').value);
            if (isNaN(val)) {
                showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາປ້ອນຕົວເລກເປີເຊັນທີ່ຖືກຕ້ອງ!", "⚠️");
                return;
            }
            syncTableInputsToData();
            excelRows.forEach(row => {
                row.profitPct = val;
            });
            renderExcelTable();
            closeUpdatePctModal();
            showAlert("ສຳເລັດ", `ອັບເປີເຊັນ (%) ເປັນ ${val}% ທຸກລາຍການແລ້ວ!`, "📊");
        }

        function calculatePercentage() {
            syncTableInputsToData();
            excelRows.forEach(row => {
                let cost = parseFloat(String(row.cost).replace(/,/g, '')) || 0;
                let price = parseFloat(String(row.price).replace(/,/g, '')) || 0;
                if (cost > 0 && price > cost) {
                    let pct = ((price - cost) / cost) * 100;
                    row.profitPct = Math.round(pct);
                }
            });
            renderExcelTable();
            showAlert("ສຳເລັດ", "ຄຳນວນເປີເຊັນສຳເລັດ!", "🧮");
        }

        function calculateSalePrices() {
            syncTableInputsToData();
            excelRows.forEach(row => {
                let cost = parseFloat(String(row.cost).replace(/,/g, '')) || 0;
                let pct = parseFloat(String(row.profitPct).replace(/,/g, '')) || 20;
                if (cost > 0) {
                    let rawPrice = cost * (1 + pct / 100);
                    let roundedPrice = Math.ceil(rawPrice / 1000) * 1000;
                    row.price = roundedPrice;
                }
            });
            renderExcelTable();
            showAlert("ສຳເລັດ", "ຄຳນວນລາຄາຂາຍຕາມສູດ ROUNDUP ສຳເລັດ!", "🏷️");
        }

        // 🌟 Pure Cloud Storage: ບັນທຶກລົງ Supabase Cloud ໂດຍກົງ 100% ບໍ່ມີ localStorage
        async function saveExcelData() {
            syncTableInputsToData();
            let validRows = excelRows.filter(r => r.code && String(r.code).trim() !== '');

            if (validRows.length === 0) {
                showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາປ້ອນຂໍ້ມູນສິນຄ້າກ່ອນບັນທຶກ!", "⚠️");
                return;
            }

            let today = new Date().toISOString().split('T')[0];

            let payload = validRows.map(row => {
                let isoDate = row.dateAdded || today;
                if (row.dateAdded && row.dateAdded.includes('/')) {
                    isoDate = parseDDMMYYYYToISO(row.dateAdded);
                }
                
                return {
                    id: row.id,
                    device_id: 'SHARED',
                    code: row.code,
                    cost: parseFloat(String(row.cost).replace(/,/g, '')) || 0,
                    original_cost: parseFloat(String(row.originalCost || row.cost).replace(/,/g, '')) || 0,
                    profit_pct: parseFloat(String(row.profitPct).replace(/,/g, '')) || 20,
                    price: parseFloat(String(row.price).replace(/,/g, '')) || 0,
                    qty: parseInt(String(row.qty).replace(/,/g, '')) || 1,
                    date_added: isoDate,
                    mfg_date: row.mfgDate || null,
                    expiry_date: row.expiryDate || null,
                    updated_at: new Date().toISOString()
                };
            });

            if (supabaseClient) {
                try {
                    let { error } = await supabaseClient.from('products').upsert(payload, { onConflict: 'id' });
                    if (error) throw error;
                } catch (e) {}
            }

            showAlert("ສຳເລັດ", `ບັນທຶກຂໍ້ມູນ ${validRows.length} ລາຍການ ໄປຍັງ Supabase Cloud ສຳເລັດຮຽບຮ້ອຍ!`, "💾");
            generateExcelCodes();
        }

        function promptPrintDate() {
            syncTableInputsToData();
            let validRows = excelRows.filter(r => r.code && String(r.code).trim() !== '');
            if (validRows.length === 0) {
                showAlert("ແຈ້ງເຕືອນ", "ກະລຸນາປ້ອນຂໍ້ມູນສິນຄ້າກ່ອນສັ່ງພິມ!", "⚠️");
                return;
            }

            let uniqueDates = [...new Set(validRows.map(r => r.dateAdded || new Date().toISOString().split('T')[0]))].sort().reverse();
            let selectElem = document.getElementById('print-date-select');
            let html = `<option value="all">🌟 ທຸກວັນ (ພິມທັງໝົດ)</option>`;
            
            uniqueDates.forEach(d => {
                let count = validRows.filter(r => (r.dateAdded || new Date().toISOString().split('T')[0]) === d).length;
                let parts = d.split('-');
                let formattedDate = parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : d;
                html += `<option value="${d}">📅 ວັນທີ: ${formattedDate} (${count} ລາຍການ)</option>`;
            });

            selectElem.innerHTML = html;
            document.getElementById('print-date-modal').classList.remove('hidden');
        }

        function closePrintDateModal() {
            document.getElementById('print-date-modal').classList.add('hidden');
        }

        function confirmAndPrintByDate() {
            let selectedDate = document.getElementById('print-date-select').value;
            closePrintDateModal();
            generateExcelCodes(selectedDate);
            setTimeout(() => {
                window.print();
            }, 500);
        }

        async function generateExcelCodes(filterDate = 'all') {
            syncTableInputsToData();
            
            let validRows = excelRows.filter(r => r.code && String(r.code).trim() !== '');
            
            if (filterDate !== 'all') {
                validRows = validRows.filter(r => (r.dateAdded || new Date().toISOString().split('T')[0]) === filterDate);
            }

            if (validRows.length === 0) {
                showAlert("ແຈ້ງເຕືອນ", "ບໍ່ພົບຂໍ້ມູນສິນຄ້າໃນວັນທີເລືອກ!", "⚠️");
                return;
            }

            duplicateRemovedList = validRows;

            document.getElementById('excel-print-area').classList.remove('hidden');
            let container = document.getElementById('excel-preview-cards');
            container.innerHTML = '';

            let promises = duplicateRemovedList.map((row, index) => {
                return new Promise((resolve) => {
                    let cleanCode = String(row.code).trim();
                    let costVal = parseFloat(String(row.cost).replace(/,/g, '')) || 0;
                    let priceVal = parseFloat(String(row.price).replace(/,/g, '')) || 0;

                    let payloadObj = {
                        code: cleanCode,
                        cost: costVal,
                        price: priceVal
                    };
                    let payloadStr = JSON.stringify(payloadObj);

                    let card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl shadow-lg border border-gray-200 text-center flex flex-col items-center justify-center relative";
                    
                    let headerHtml = `<div class="font-bold text-gray-800 text-sm mb-2 w-full truncate px-2" title="${cleanCode}">${cleanCode}</div>`;

                    let codeContainerId = `ex-code-${index}-${Date.now()}`;
                    
                    let dateDisplay = '';
                    if (row.mfgDate && row.expiryDate) {
                        dateDisplay = `<div class="text-[9px] text-gray-500 mt-1 font-semibold">MFG: ${formatDateToDDMMYYYY(row.mfgDate)} | EXP: ${formatDateToDDMMYYYY(row.expiryDate)}</div>`;
                    } else if (row.dateAdded) {
                        dateDisplay = `<div class="text-[9px] text-gray-400 mt-1">ວັນນຳເຂົ້າ: ${formatDateToDDMMYYYY(row.dateAdded)}</div>`;
                    }

                    if (currentCodeType === 'qrcode') {
                        card.innerHTML = `
                            ${headerHtml}
                            <div class="bg-gray-50 p-2 rounded-lg inline-block">
                                <canvas id="${codeContainerId}"></canvas>
                            </div>
                            <div class="mt-2 text-xs font-semibold text-gray-600">ລະຫັດ: <span class="text-blue-600 font-mono">${cleanCode}</span></div>
                            ${dateDisplay}
                        `;
                        container.appendChild(card);
                        setTimeout(() => {
                            QRCode.toCanvas(document.getElementById(codeContainerId), payloadStr, { width: 140, margin: 1 }, function (error) {
                                resolve();
                            });
                        }, 50);
                    } else {
                        card.innerHTML = `
                            ${headerHtml}
                            <div class="bg-gray-50 p-2 rounded-lg w-full flex justify-center overflow-hidden">
                                <svg id="${codeContainerId}" class="max-w-full"></svg>
                            </div>
                            ${dateDisplay}
                        `;
                        container.appendChild(card);
                        setTimeout(() => {
                            try {
                                JsBarcode(`#${codeContainerId}`, cleanCode, {
                                    format: "CODE128", width: 2, height: 50, displayValue: true, fontSize: 14, margin: 5
                                });
                            } catch (e) {
                                document.getElementById(codeContainerId).outerHTML = `<div class="text-red-500 text-xs py-4">ລະຫັດ Barcode ບໍ່ຮອງຮັບຮູບແບບນີ້</div>`;
                            }
                            resolve();
                        }, 50);
                    }
                });
            });

            await Promise.all(promises);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDeviceId();
            let userRole = localStorage.getItem('pos_user_role');
            let shopOwner = localStorage.getItem('pos_shop_owner');
            let linkedAdminId = localStorage.getItem('pos_linked_admin_id');
            if (userRole === 'admin' || shopOwner === 'true' || linkedAdminId) {
                let roleModal = document.getElementById('role-select-modal');
                if (roleModal) roleModal.classList.add('hidden');
                let headerConnectQrBtn = document.getElementById('header-connect-qr-btn');
                if (headerConnectQrBtn) headerConnectQrBtn.classList.remove('hidden');
                let rateBtn = document.getElementById('header-rate-btn');
                if (rateBtn) rateBtn.classList.remove('hidden');
            }
            updateHeaderTitle();
            checkTrialLicense();
        });
    </script>
</body>
