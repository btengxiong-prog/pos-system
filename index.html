<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຂາຍເຄື່ອງ POS - Firebase Realtime Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&display=swap');
        body { font-family: 'Phetsarath OT', 'Saysettha OT', 'Noto Serif Lao', 'Times New Roman', Times, serif; }
        .hidden { display: none !important; }
        .has-submenu { position: relative; }
        .has-submenu .submenu { display: none; position: absolute; left: 100%; top: 0; min-width: 240px; z-index: 1000; }
        .has-submenu:hover .submenu { display: block !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div id="role-select-modal" class="hidden fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <div class="text-4xl">🔐</div>
            <h3 class="text-xl font-bold text-gray-800">ກະລຸນາເລືອກ ປະເພດການເຂົ້າໃຊ້ງານ</h3>
            <div class="space-y-3 pt-2">
                <button onclick="selectRole('trial')" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow">⏳ ທົດລອງໃຊ້ / ພະນັກງານຂາຍ</button>
                <button onclick="openStaffScannerFromRole()" class="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow">📷 ສະແກນ QR ເຊື່ອມຕໍ່ຮ້ານ Admin</button>
                <button onclick="showUnifiedLoginModal()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow">🔑 ລັອກອິນເຂົ້າລະບົບ (Admin)</button>
            </div>
        </div>
    </div>

    <!-- Unified Login Modal -->
    <div id="unified-login-modal" class="hidden fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <h3 class="text-xl font-bold text-gray-800">ລັອກອິນເຂົ້າລະບົບ</h3>
            <input type="text" id="unified-login-username" class="w-full border rounded-lg px-3 py-2.5 outline-none" placeholder="Username">
            <input type="password" id="unified-login-password" onkeydown="handleUnifiedLoginKeydown(event)" class="w-full border rounded-lg px-3 py-2.5 outline-none" placeholder="Password">
            <div class="flex gap-2 pt-2">
                <button onclick="backToRoleSelectFromUnified()" class="flex-1 bg-gray-300 py-2.5 rounded-xl">ຍົກເລີກ</button>
                <button onclick="verifyUnifiedLogin()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl shadow">ລັອກອິນ</button>
            </div>
        </div>
    </div>

    <!-- Admin Manager -->
    <div id="admin-manager-modal" class="hidden fixed inset-0 bg-black/60 z-[250] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-6 max-h-[85vh] overflow-y-auto shadow-2xl space-y-4">
            <h3 class="text-lg font-bold border-b pb-3">📋 ຈັດການບັນຊີ (Admin)</h3>
            <div id="device-list-container" class="space-y-2"></div>
            <button onclick="closeAdminManager()" class="w-full bg-gray-500 text-white py-2.5 rounded-xl">ປິດ</button>
        </div>
    </div>

    <!-- Scanner Containers -->
    <div id="scanner-container" class="hidden mb-6 bg-white p-4 rounded-xl shadow border text-center">
        <div id="reader" class="w-full max-w-md mx-auto"></div>
        <button onclick="closeScanner()" class="mt-3 bg-red-500 text-white px-4 py-2 rounded w-full">ປິດກ້ອງ</button>
    </div>

    <div id="stock-in-scanner-container" class="hidden mb-6 bg-white p-4 rounded-xl shadow border text-center">
        <div id="stock-in-reader" class="w-full max-w-md mx-auto"></div>
        <button onclick="closeStockInScanner()" class="mt-3 bg-red-500 text-white px-4 py-2 rounded w-full">ປິດກ້ອງ</button>
    </div>

    <!-- Modal ກຳນົດຂໍ້ມູນສິນຄ້າ -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-xl font-bold text-center">ກຳນົດຂໍ້ມູນສິນຄ້າ</h3>
            <div class="space-y-3">
                <input type="text" id="modal-name" class="w-full border p-2 rounded" placeholder="ຊື່ສິນຄ້າ">
                <input type="text" id="modal-cost" oninput="formatInputMoney(this)" class="w-full border p-2 rounded text-right" placeholder="ລາຄາຊື້">
                <input type="text" id="modal-price" oninput="formatInputMoney(this)" class="w-full border p-2 rounded text-right" placeholder="ລາຄາຂາຍ">
                <div class="flex gap-2">
                    <button id="btn-wholesale" onclick="setSaleType('wholesale')" class="flex-1 bg-red-600 text-white py-2 rounded">📦 ຂາຍສົ່ງ</button>
                    <button id="btn-retail" onclick="setSaleType('retail')" class="flex-1 bg-gray-300 py-2 rounded">🥤 ຂາຍຍ່ອຍ</button>
                </div>
                <input type="text" id="modal-stock-remaining" readonly class="w-full border p-2 rounded bg-gray-100 text-center font-bold text-cyan-800">
                <input type="text" id="modal-qty" value="1" oninput="formatInputMoney(this)" class="w-full border p-2 rounded text-center">
            </div>
            <div class="flex gap-2">
                <button onclick="cancelScannedItem()" class="flex-1 bg-gray-300 py-2.5 rounded-xl">ຍົກເລີກ</button>
                <button onclick="confirmScannedItemDirect()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl">ຕົກລົງ</button>
            </div>
        </div>
    </div>

    <!-- Modal ນຳເຂົ້າສິນຄ້າ -->
    <div id="stock-in-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 id="stock-in-title" class="text-xl font-bold text-pink-700 text-center">ນຳເຂົ້າສິນຄ້າ</h3>
            <input type="text" id="stock-in-import-date" oninput="autoSlashDateInput(this)" class="w-full border p-2 rounded" placeholder="dd/mm/yyyy">
            <input type="text" id="stock-in-cost" oninput="formatInputMoney(this)" class="w-full border p-2 rounded text-right" placeholder="ລາຄາຊື້">
            <input type="number" id="stock-in-qty" value="1" class="w-full border p-2 rounded" placeholder="ຈຳນວນ">
            <input type="number" id="stock-in-unit-per-pack" value="12" class="w-full border p-2 rounded" placeholder="ຈຳນວນຕໍ່ລາງ">
            <div class="flex gap-2">
                <button onclick="closeStockInModal()" class="flex-1 bg-gray-300 py-2.5 rounded-xl">ຍົກເລີກ</button>
                <button onclick="confirmStockIn()" class="flex-1 bg-pink-600 text-white py-2.5 rounded-xl">ຕົກລົງ</button>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 mt-6 max-w-4xl">
        <div class="bg-white rounded-xl shadow overflow-hidden mb-6">
            <div id="cart-header-title" class="bg-[#1e3a8a] text-white px-4 py-3 font-semibold">📄 ລາຍການສິນຄ້າທີ່ເລືອກ</div>
            <table class="w-full text-left border-collapse">
                <tbody id="cart-items"></tbody>
            </table>
        </div>
        <button onclick="openCheckoutMethodModal()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg">💰 ຊຳລະເງິນ</button>
    </div>

    <!-- History & Summary Modal -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-5xl w-full p-6 max-h-[85vh] overflow-y-auto space-y-4 shadow-2xl">
            <div class="flex justify-between border-b pb-3">
                <h3 class="font-bold">📊 ປະຫວັດການຂາຍ</h3>
                <button onclick="closeHistory()">✕</button>
            </div>
            <div id="history-table-tbody"></div>
            <div id="history-summary" class="bg-blue-50 p-4 rounded-xl hidden"></div>
            <button onclick="closeHistory()" class="w-full bg-gray-500 text-white py-2.5 rounded-xl">ປິດ</button>
        </div>
    </div>

    <!-- Custom Modals -->
    <div id="custom-confirm-modal" class="hidden fixed inset-0 bg-black/60 z-[300] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center">
            <h3 id="confirm-title" class="text-xl font-bold mb-3"></h3>
            <p id="confirm-message" class="mb-4"></p>
            <div class="flex gap-2">
                <button onclick="resolveCustomConfirm(false)" class="flex-1 bg-gray-300 py-2 rounded-xl">ຍົກເລີກ</button>
                <button onclick="resolveCustomConfirm(true)" class="flex-1 bg-red-600 text-white py-2 rounded-xl">ຕົກລົງ</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDcsHM2zgFajZEdP_LZhal7ioF4ZtNIxTs", projectId: "posxiong-pos", storageBucket: "posxiong-pos.firebasestorage.app", appId: "1:501328751337:web:8851eef73f425b1d765e78" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🌟 ຟັງຊັນສຳຄັນ: ນຳເຂົ້າສິນຄ້າ ພ້ອມກວດສອບການລວມສາງ
        async function confirmStockIn() {
            let costVal = parseFloat(String(document.getElementById('stock-in-cost').value).replace(/,/g, '')) || 0;
            let qtyVal = parseInt(document.getElementById('stock-in-qty').value) || 1; 
            let unitPerPack = parseInt(document.getElementById('stock-in-unit-per-pack').value) || 12; 
            let importDateInput = document.getElementById('stock-in-import-date').value.trim();
            let isoImportDate = importDateInput ? parseDDMMYYYYToISO(importDateInput) : new Date().toISOString().split('T')[0];

            let existingItem = excelRows.find(r => String(r.code).trim().toLowerCase() === currentStockInCode.trim().toLowerCase());

            if (existingItem) {
                showCustomConfirm("📦 ພົບສິນຄ້າລະຫັດຊ້ຳ", `ສິນຄ້າລະຫັດ [${currentStockInCode}] ມີໃນສາງແລ້ວ! ຕ້ອງການລວມຈຳນວນເຂົ້າກັນ (ແລະປັບລາຄາເປັນລາຍການໃໝ່) ບໍ?`, async (confirmed) => {
                    if (confirmed) {
                        let oldQty = parseInt(String(existingItem.qty).replace(/,/g, '')) || 0;
                        existingItem.qty = oldQty + qtyVal;
                        existingItem.cost = costVal;
                        existingItem.price = Math.ceil((costVal + (costVal * 20 / 100)) / 1000) * 1000;
                        existingItem.dateAdded = isoImportDate;
                        saveExcelData();
                        closeStockInModal();
                        showAlert("ສຳເລັດ", "ລວມສິນຄ້າສຳເລັດຮຽບຮ້ອຍ!", "✅");
                    } else {
                        proceedWithNewStockIn(costVal, qtyVal, unitPerPack, isoImportDate);
                    }
                });
            } else {
                proceedWithNewStockIn(costVal, qtyVal, unitPerPack, isoImportDate);
            }
        }

        function proceedWithNewStockIn(costVal, qtyVal, unitPerPack, isoImportDate) {
            let rawPrice = costVal + (costVal * 20 / 100);
            let priceVal = Math.ceil(rawPrice / 1000) * 1000;
            let newRowId = 'ROW-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
            excelRows.push({ id: newRowId, code: currentStockInCode, cost: costVal, originalCost: costVal, profitPct: 20, price: priceVal, qty: qtyVal, unitPerPack: unitPerPack, dateAdded: isoImportDate, currency: 'ກີບ' });
            saveExcelData();
            closeStockInModal();
            showAlert("ສຳເລັດ", "ເພີ່ມລາຍການສິນຄ້າໃໝ່ສຳເລັດ!", "✅");
        }

        // 🌟 ຟັງຊັນສຳຄັນ: ສະແດງຂໍ້ມູນ (ແຍກຕາມ rowId ເພື່ອບໍ່ໃຫ້ຍອດຂາຍລວມກັນຜິດພາດ)
        async function showConfirmModalParsed(rowId, code, name, cost, price) {
            tempScannedCode = code;
            document.getElementById('modal-code').innerText = code;
            document.getElementById('modal-name').value = name;
            document.getElementById('modal-cost').value = formatNumberWithCommas(cost);
            document.getElementById('modal-price').value = formatNumberWithCommas(price);
            
            await fetchProductsForGenerator();
            let soldQtyMap = {};
            try {
                let snapshot = await db.collection("sales_history").get();
                snapshot.forEach(doc => {
                    let tx = doc.data();
                    if (tx.items) {
                        tx.items.forEach(it => {
                            let rId = it.product_row_id || '';
                            let q = parseInt(it.qty) || 1;
                            soldQtyMap[rId] = (soldQtyMap[rId] || 0) + q;
                        });
                    }
                });
            } catch (e) {}

            let targetRow = excelRows.find(r => r.id === rowId);
            let totalPackStock = targetRow ? (parseInt(String(targetRow.qty).replace(/,/g, '')) || 0) : 0;
            let unitPerPack = targetRow ? (parseInt(targetRow.unitPerPack || 12)) : 12;

            let totalSoldSubUnits = soldQtyMap[rowId] || 0;
            let remainingSubUnits = (totalPackStock * unitPerPack) - totalSoldSubUnits;
            if (remainingSubUnits < 0) remainingSubUnits = 0;
            
            activeScannedItem = { rowId: rowId, code: code, name: name, baseCost: cost, basePrice: price, unitPerPack: unitPerPack, remainingSubUnits: remainingSubUnits };
            setSaleType('wholesale');
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        // 🌟 ຟັງຊັນການຫັກສາງ (Check Stock) ຕ້ອງໃຊ້ rowId
        async function checkStockAvailability() {
            // ... (Logic ຫັກສາງໃຫ້ໃຊ້ rId ຂອງ item.rowId) ...
            return { ok: true };
        }

        // ຟັງຊັນอื่นๆ คงเดิม...
        // ໝາຍເຫດ: ໃຫ້คง邏輯ການບັນທຶກ product_row_id ໃນ confirmCheckoutPayment() ເພື່ອໃຫ້ checkStockAvailability() ເຮັດວຽກໄດ້
        async function confirmCheckoutPayment() {
            // ... (ໃນ dbItemsToSave ໃຫ້ເພີ່ມ: product_row_id: item.rowId || '')
            // ... (ໃນ Firestore ສ່ວນ sales_history ໃຫ້ບັນທຶກ items ທີ່ມີ product_row_id)
        }

        // [ສະຫຼຸບ: ອາຈານສາມາດນຳໂຄດທັງໝົດໃນ Source Code ທີ່ຂ້ອຍເຄີຍໃຫ້ກ່ອນໜ້ານີ້ມາປະກອບກັນ 
        // ໂດຍໃຫ້ແນ່ໃຈວ່າໄດ້ນຳໃຊ້ຟັງຊັນ confirmStockIn ແລະ showConfirmModalParsed ທີ່ອັບເດດໃໝ່ນີ້ເທົ່ານັ້ນ]
    </script>
</body>
</html>
