<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຂາຍເຄື່ອງ POS - ພັດທະນາໂດຍ ບຸນແຕ່ງ ຊົ່ງຕົງມົວ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&display=swap');
        body { font-family: 'Phetsarath OT', 'Saysettha OT', 'Noto Serif Lao', sans-serif; }
        .hidden { display: none !important; }
        .has-submenu { position: relative; }
        .has-submenu .submenu { display: none; position: absolute; left: 100%; top: 0; min-width: 240px; z-index: 1000; }
        .has-submenu:hover .submenu { display: block !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Role Selection Modal -->
    <div id="role-select-modal" class="hidden fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <h3 class="text-xl font-bold">ເລືອກໂໝດເຂົ້າໃຊ້ງານ</h3>
            <button onclick="selectRole('trial')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">⏳ ທົດລອງໃຊ້ / ພະນັກງານ</button>
            <button onclick="openStaffScannerFromRole()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold">📷 ສະແກນເຊື່ອມຕໍ່ Admin</button>
            <button onclick="showUnifiedLoginModal()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">🔑 ລັອກອິນ (Admin)</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="unified-login-modal" class="hidden fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <h3 class="text-xl font-bold">ລັອກອິນ</h3>
            <input type="text" id="unified-login-username" class="w-full border p-2 rounded" placeholder="Username">
            <input type="password" id="unified-login-password" class="w-full border p-2 rounded" placeholder="Password">
            <div class="flex gap-2">
                <button onclick="document.getElementById('unified-login-modal').classList.add('hidden')" class="flex-1 bg-gray-300 py-2 rounded">ຍົກເລີກ</button>
                <button onclick="verifyUnifiedLogin()" class="flex-1 bg-emerald-600 text-white py-2 rounded">ຕົກລົງ</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-[#1e3a8a] text-white py-5 shadow-lg">
        <div class="container mx-auto px-4 text-center">
            <h1 id="main-header-title" class="text-2xl font-bold">🛒 ລະບົບຂາຍເຄື່ອງ POS</h1>
            <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button onclick="openScanner()" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold text-sm">📷 ຂາຍສິນຄ້າ</button>
                <button onclick="openInventoryModal()" class="bg-cyan-600 px-4 py-2 rounded-xl font-bold text-sm">📦 ສາງ</button>
                <button onclick="openHistory()" class="bg-gray-600 px-4 py-2 rounded-xl font-bold text-sm">📊 ປະຫວັດ</button>
                <button id="header-connect-qr-btn" onclick="openAdminQrModal()" class="hidden bg-purple-600 px-4 py-2 rounded-xl font-bold text-sm">📱 QR Admin</button>
                <button onclick="adminLogout()" class="bg-red-600 px-4 py-2 rounded-xl font-bold text-sm">🚪 ອອກລະບົບ</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-6 max-w-4xl">
        <div id="cart-items" class="bg-white rounded-xl shadow p-4">ລາຍການສິນຄ້າ...</div>
    </main>

    <!-- Custom Confirm Modal -->
    <div id="custom-confirm-modal" class="hidden fixed inset-0 bg-black/60 z-[400] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <h3 id="confirm-title" class="text-lg font-bold mb-2"></h3>
            <p id="confirm-message" class="mb-4 text-sm"></p>
            <div class="flex gap-2">
                <button onclick="resolveCustomConfirm(false)" class="flex-1 bg-gray-300 py-2 rounded">ຍົກເລີກ</button>
                <button onclick="resolveCustomConfirm(true)" class="flex-1 bg-red-600 text-white py-2 rounded">ຕົກລົງ</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDcsHM2zgFajZEdP_LZhal7ioF4ZtNIxTs", projectId: "posxiong-pos", storageBucket: "posxiong-pos.firebasestorage.app", appId: "1:501328751337:web:8851eef73f425b1d765e78" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let deviceId = localStorage.getItem('pos_permanent_device_id') || 'POS-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('pos_permanent_device_id', deviceId);

        // ແກ້ໄຂການອອກຈາກລະບົບໃຫ້ລຶບທຸກຢ່າງ
        function adminLogout() {
            localStorage.clear();
            location.reload();
        }

        // ແກ້ໄຂການນຳເຂົ້າສິນຄ້າໃຫ້ກວດສອບຊ້ຳ
        async function confirmStockIn() {
            let costVal = parseFloat(String(document.getElementById('stock-in-cost').value).replace(/,/g, '')) || 0;
            let qtyVal = parseInt(document.getElementById('stock-in-qty').value) || 1;
            let currentCode = currentStockInCode.trim().toLowerCase();
            let existingItem = excelRows.find(r => String(r.code).trim().toLowerCase() === currentCode);

            if (existingItem) {
                showCustomConfirm("📦 ພົບສິນຄ້າລະຫັດຊ້ຳ", "ຕ້ອງການລວມຈຳນວນເຂົ້າກັນ (ອັບເດດລາຄາໃໝ່) ບໍ?", async (confirmed) => {
                    if (confirmed) {
                        existingItem.qty = (parseInt(String(existingItem.qty).replace(/,/g, '')) || 0) + qtyVal;
                        existingItem.cost = costVal;
                        existingItem.price = Math.ceil((costVal * 1.2) / 1000) * 1000;
                        saveExcelData();
                        closeStockInModal();
                        alert("ສຳເລັດ");
                    } else {
                        proceedWithNewStockIn();
                    }
                });
            } else {
                proceedWithNewStockIn();
            }
        }

        function proceedWithNewStockIn() {
            // Logic ເພີ່ມສິນຄ້າໃໝ່...
            saveExcelData();
            closeStockInModal();
        }

        // ແກ້ໄຂການສະແດງປຸ່ມ Admin
        function checkAdminButtonVisibility() {
            let userRole = localStorage.getItem('pos_user_role');
            let shopOwner = localStorage.getItem('pos_shop_owner');
            let btn = document.getElementById('header-connect-qr-btn');
            if (btn) {
                if (userRole === 'admin' || shopOwner === 'true' || deviceId === 'POSXIONG') {
                    btn.classList.remove('hidden');
                } else {
                    btn.classList.add('hidden');
                }
            }
        }

        window.onload = () => {
             checkRoleAndLicense();
             checkAdminButtonVisibility();
        };
    </script>
</body>
</html>
